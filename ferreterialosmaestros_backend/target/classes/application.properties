spring.application.name=ferreterialosmaestros
server.port=${SERVER_PORT:8080}

# Conexión MySQL (configurable por variables de entorno para local/Docker/producción)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ferreteria_los_maestros?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USER:TU_USUARIO_MYSQL}
spring.datasource.password=${DB_PASSWORD:TU_PASSWORD_MYSQL}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:true}
spring.jpa.open-in-view=false

# JWT (se usará en Fase 2)
jwt.secret=${JWT_SECRET:CAMBIA_ESTA_CLAVE_POR_UNA_LARGA_Y_SECRETA_AL_MENOS_32_CARACTERES}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Swagger (springdoc) - Fase 2
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
